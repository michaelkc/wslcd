name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Build binary
        working-directory: src
        run: |
          GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -tags "netgo osusergo" \
              -ldflags "-s -w -extldflags=-static" \
              -o ../dist/wslcd ./cmd/wslcd

      - name: Build .deb package (amd64 only; dpkg-deb is host-arch)
        if: matrix.goarch == 'amd64'
        run: ./packaging/build-deb.sh "0.0.0-ci" "amd64" dist/wslcd dist

      - name: Smoke test (amd64 only)
        if: matrix.goarch == 'amd64'
        run: |
          test -x dist/wslcd && file dist/wslcd | grep -q 'statically linked'
