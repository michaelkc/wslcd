name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            debarch: amd64
          - goarch: arm64
            debarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Build binary
        working-directory: src
        run: |
          GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -tags "netgo osusergo" \
              -ldflags "-s -w -extldflags=-static" \
              -o ../dist/wslcd ./cmd/wslcd

      - name: Stage release files
        run: |
          cp dist/wslcd dist/wslcd-linux-${{ matrix.goarch }}
          ./packaging/build-deb.sh "${GITHUB_REF_NAME#v}" "${{ matrix.debarch }}" dist/wslcd dist

      - uses: actions/upload-artifact@v4
        with:
          name: wslcd-${{ matrix.goarch }}
          path: |
            dist/wslcd-linux-${{ matrix.goarch }}
            dist/wslcd_${{ matrix.debarch }}.deb

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "wslcd $GITHUB_REF_NAME" \
            --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/*
